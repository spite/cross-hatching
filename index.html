<!doctype html>
<html lang="en">
	<head>
		<title>Cross-hatching GLSL shader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/guspira@0.1.1/dist/guspira.min.css">
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			html, body { height: 100%; }
			body {
				color: #222;
				font-family: tahoma, sans-serif;
				font-size: 13px;
				background-color: #ddd;
				background-position: center;
				background-size: cover;
				background-repeat: no-repeat;
			}
			body.tiled {
				background-position: 0 bottom;
				background-size: auto;
				background-repeat: repeat;
				overflow: hidden;
			}
			canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; cursor: grab; }
			canvas.dragging { cursor: grabbing; }
			#info {
				background-color: rgba( 0, 0, 0, .6 );
				color: #fff;
				text-shadow: 0 -1px 0 rgba( 0, 0, 0, .6 );
				position: absolute;
				left: 10px; top: 0;
				max-width: 460px;
				padding: 20px;
				line-height: 1.4em;
				z-index: 100;
			}
			#info p { margin-bottom: 10px; }
			#info p:last-child { margin-bottom: 0; }
			a { color: white; }
			#gui-container { position: absolute; right: 0; top: 0; width: 300px; max-height: 100%; overflow: auto; z-index: 100; }
			@media only screen and (max-width: 700px) {
				#info { display: none; }
			}
		</style>
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
		</script>
	</head>

	<body>

		<div id="info">
			<p><b>Cross-hatching GLSL shader</b> Blinn-Phong shading and rim lighting.<br>
			Based on <a href="https://hhoppe.com/hatching.pdf" target="_blank" rel="noopener">Microsoft Research "Real-Time Hatching" paper</a>.</p>
			<p>Click and drag to move the model, scroll or pinch to zoom. Play with the controls!<br>
			Coded by Jaume Sanchez <a href="https://twitter.com/thespite" target="_blank" rel="noopener">@thespite</a> using <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>.<br>
			Find the code on <a href="https://github.com/spite/cross-hatching" target="_blank" rel="noopener">GitHub</a>.</p>
		</div>
		<div id="gui-container"></div>

		<script type="x-shader/x-vertex" id="vertexshader">

			varying vec3 vNormal;
			varying vec2 vUv;
			varying vec3 vPosition;
			varying float nDotVP;

			uniform vec2 repeat;
			uniform vec3 lightPosition;
			uniform float showOutline;

			void main() {

				// the outline is the mesh, a bit bigger, behind it
				vec3 posInc = showOutline * normal;

				vUv = repeat * uv;

				vec4 mvPosition = modelViewMatrix * vec4( position + posInc, 1.0 );
				vPosition = mvPosition.xyz;
				gl_Position = projectionMatrix * mvPosition;

				vNormal = normalMatrix * normal;

				nDotVP = max( 0., dot( vNormal, normalize( lightPosition ) ) );

			}

		</script>

		<script type="x-shader/x-fragment" id="fragmentshader">

			uniform sampler2D hatch1;
			uniform sampler2D hatch2;
			uniform sampler2D hatch3;
			uniform sampler2D hatch4;
			uniform sampler2D hatch5;
			uniform sampler2D hatch6;
			uniform sampler2D paper;
			uniform vec2 bkgResolution;
			uniform vec2 viewport;
			uniform float pixelRatio;
			uniform float tiled;
			uniform vec3 lightPosition;

			varying vec2 vUv;
			varying vec3 vNormal;
			varying vec3 vPosition;
			varying float nDotVP;

			uniform float ambientWeight;
			uniform float diffuseWeight;
			uniform float rimWeight;
			uniform float specularWeight;
			uniform float shininess;
			uniform float invertRim;
			uniform float solidRender;
			uniform float showOutline;
			uniform vec3 inkColor;

			vec4 shade() {

				float diffuse = nDotVP;
				float specular = 0.;
				float ambient = 1.;

				vec3 n = normalize( vNormal );

				vec3 r = normalize( - reflect( lightPosition, n ) );
				vec3 v = normalize( - vPosition.xyz );
				float nDotHV = max( 0., dot( r, v ) );

				if( nDotVP != 0. ) specular = pow( nDotHV, shininess );
				float rim = max( 0., abs( dot( n, v ) ) );
				if( invertRim == 1. ) rim = 1. - rim;

				float shading = ambientWeight * ambient + diffuseWeight * diffuse + rimWeight * rim + specularWeight * specular;

				if( solidRender == 1. ) return vec4( shading );

				// from the darkest texture to the lightest, and then to white
				vec4 c = vec4( 1. );
				float step = 1. / 6.;
				if( shading <= step ) {
					c = mix( texture2D( hatch6, vUv ), texture2D( hatch5, vUv ), 6. * shading );
				}
				if( shading > step && shading <= 2. * step ) {
					c = mix( texture2D( hatch5, vUv ), texture2D( hatch4, vUv ), 6. * ( shading - step ) );
				}
				if( shading > 2. * step && shading <= 3. * step ) {
					c = mix( texture2D( hatch4, vUv ), texture2D( hatch3, vUv ), 6. * ( shading - 2. * step ) );
				}
				if( shading > 3. * step && shading <= 4. * step ) {
					c = mix( texture2D( hatch3, vUv ), texture2D( hatch2, vUv ), 6. * ( shading - 3. * step ) );
				}
				if( shading > 4. * step && shading <= 5. * step ) {
					c = mix( texture2D( hatch2, vUv ), texture2D( hatch1, vUv ), 6. * ( shading - 4. * step ) );
				}
				if( shading > 5. * step ) {
					c = mix( texture2D( hatch1, vUv ), vec4( 1. ), 6. * ( shading - 5. * step ) );
				}

				return mix( mix( vec4( inkColor, 1. ), vec4( 1. ), c.r ), c, .5 );

			}

			void main() {

				// the paper as the page has it behind the canvas: one sheet that covers it, or tiles from the bottom left
				vec2 page = gl_FragCoord.xy / pixelRatio;
				vec2 sheet = bkgResolution * max( viewport.x / bkgResolution.x, viewport.y / bkgResolution.y );
				vec2 paperUv = tiled == 1. ? mod( page, bkgResolution ) / bkgResolution : ( page - .5 * ( viewport - sheet ) ) / sheet;
				vec4 dst = vec4( texture2D( paper, paperUv ).rgb, 1. );

				vec4 src = showOutline == 1. ? .5 * vec4( inkColor, 1. ) : shade();

				gl_FragColor = vec4( ( src * dst ).rgb, 1. );

			}

		</script>

<script type="module">
import * as THREE from 'three';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { GUI, signal, effect } from 'https://cdn.jsdelivr.net/npm/guspira@0.1.1/dist/guspira.min.js';

// each one is a sheet that covers the page, but the squared one, which tiles so its grid stays the same size
const papers = {
	crumpled: { file: 'paper.jpg' },
	grainy: { file: 'paper2.jpg' },
	fibers: { file: 'brown.jpg' },
	squared: { file: 'paper4.jpg', tiled: true },
	wrapper: { file: 'paper5.jpg' },
	parchment: { file: 'paper6.jpg' }
};

const presets = {
	Default: { ambient: 8, diffuse: 100, specular: 100, rim: 46, shininess: 49, invertRim: false, outline: false, solid: false, model: 'torusKnot', paper: 'crumpled', ink: '#4848a4' },
	Sketch: { ambient: 9.8, diffuse: 100, specular: 100, rim: 81, shininess: 12, invertRim: true, outline: false, solid: false, model: 'distort', paper: 'fibers', ink: '#afafaf' },
	Classroom: { ambient: 13, diffuse: 27, specular: 100, rim: 76, shininess: 27, invertRim: false, outline: true, solid: false, model: 'sphere', paper: 'squared', ink: '#2929ca' },
	Engraving: { ambient: 0, diffuse: 57, specular: 100, rim: 77, shininess: 15, invertRim: true, outline: false, solid: false, model: 'torus', paper: 'grainy', ink: '#5a786f' },
};

const params = {
	preset: signal( 'Default' ),
	ambient: signal( 8 ),
	diffuse: signal( 100 ),
	specular: signal( 100 ),
	rim: signal( 46 ),
	shininess: signal( 49 ),
	invertRim: signal( false ),
	outline: signal( false ),
	solid: signal( false ),
	model: signal( 'torusKnot' ),
	paper: signal( 'crumpled' ),
	ink: signal( '#4848a4' )
};

const gui = new GUI( 'Cross-hatching', document.getElementById( 'gui-container' ) );
gui.addSelect( 'preset', params.preset, Object.keys( presets ) );
gui.addSeparator();
gui.addSlider( 'ambient', params.ambient, 0, 100, .1 );
gui.addSlider( 'diffuse', params.diffuse, 0, 100, .1 );
gui.addSlider( 'specular', params.specular, 0, 100, .1 );
gui.addSlider( 'rim', params.rim, 0, 100, .1 );
gui.addSlider( 'shininess', params.shininess, 1, 100, .1 );
gui.addCheckbox( 'invert rim', params.invertRim );
gui.addCheckbox( 'outline', params.outline );
gui.addCheckbox( 'solid render', params.solid );
gui.addSeparator();
gui.addSelect( 'model', params.model, [ [ 'cube', 'Cube' ], [ 'sphere', 'Sphere' ], [ 'torusKnot', 'Torus knot' ], [ 'torus', 'Torus' ], [ 'distort', 'Distort' ], [ 'capsule', 'Capsule' ] ] );
gui.addSelect( 'paper', params.paper, [ [ 'crumpled', 'Crumpled' ], [ 'grainy', 'Grainy' ], [ 'fibers', 'Fibers' ], [ 'squared', 'Squared' ], [ 'wrapper', 'Wrapper' ], [ 'parchment', 'Parchment' ] ] );
gui.addColor( 'ink', params.ink );

effect( function () {

	const preset = presets[ params.preset() ];
	for ( const name in preset ) params[ name ].set( preset[ name ] );

} );

const renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
renderer.setPixelRatio( window.devicePixelRatio );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.autoClear = false;
document.body.appendChild( renderer.domElement );

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 120, window.innerWidth / window.innerHeight, 1, 1100 );

const loader = new THREE.TextureLoader();

const material = new THREE.ShaderMaterial( {
	uniforms: {
		showOutline: { value: 0 },
		ambientWeight: { value: 0 },
		diffuseWeight: { value: 1 },
		rimWeight: { value: 1 },
		specularWeight: { value: 1 },
		shininess: { value: 1 },
		invertRim: { value: 0 },
		solidRender: { value: 0 },
		inkColor: { value: new THREE.Vector3() },
		bkgResolution: { value: new THREE.Vector2( 1, 1 ) },
		viewport: { value: new THREE.Vector2( window.innerWidth, window.innerHeight ) },
		tiled: { value: 0 },
		pixelRatio: { value: 1 },
		lightPosition: { value: new THREE.Vector3( - 100, 100, 0 ) },
		hatch1: { value: null },
		hatch2: { value: null },
		hatch3: { value: null },
		hatch4: { value: null },
		hatch5: { value: null },
		hatch6: { value: null },
		paper: { value: null },
		repeat: { value: new THREE.Vector2( 1, 1 ) }
	},
	vertexShader: document.getElementById( 'vertexshader' ).textContent,
	fragmentShader: document.getElementById( 'fragmentshader' ).textContent
} );

// ---- the hatching, from the lightest texture to the darkest

for ( let i = 0; i < 6; i ++ ) {

	const texture = loader.load( `assets/hatch_${ i }.jpg` );
	texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
	material.uniforms[ 'hatch' + ( i + 1 ) ].value = texture;

}

// ---- the paper, behind the canvas and in the shader

effect( function () {

	const paper = papers[ params.paper() ];
	const file = 'assets/' + paper.file;

	loader.load( file, function ( texture ) {

		// a later choice already won
		if ( paper !== papers[ params.paper() ] ) return texture.dispose();

		texture.generateMipmaps = false;
		texture.minFilter = THREE.LinearFilter;

		if ( material.uniforms.paper.value ) material.uniforms.paper.value.dispose();
		material.uniforms.paper.value = texture;
		material.uniforms.bkgResolution.value.set( texture.image.width, texture.image.height );
		material.uniforms.tiled.value = paper.tiled ? 1 : 0;
		document.body.classList.toggle( 'tiled', paper.tiled === true );
		document.body.style.backgroundImage = `url(${ file })`;

	} );

} );

// ---- the models

const noise = new ImprovedNoise();

function distorted() {

	const geometry = new THREE.IcosahedronGeometry( 40, 15 );
	const position = geometry.attributes.position;
	const v = new THREE.Vector3();
	const n = new THREE.Vector3();
	const f = .05;

	for ( let i = 0; i < position.count; i ++ ) {

		v.fromBufferAttribute( position, i );
		n.copy( v ).normalize();
		v.add( n.multiplyScalar( 10 * noise.noise( f * v.x, f * v.y, f * v.z ) ) );
		position.setXYZ( i, v.x, v.y, v.z );

	}

	// smooth across the faces, which don't share their vertices
	return toCreasedNormals( geometry, Math.PI );

}

const models = {
	cube: { make: () => new THREE.BoxGeometry( 40, 40, 40 ), repeat: [ 1, 1 ] },
	sphere: { make: () => new THREE.SphereGeometry( 40, 36, 36 ), repeat: [ 4, 4 ] },
	torusKnot: { make: () => new THREE.TorusKnotGeometry( 50, 10, 200, 50, 1, 3 ), repeat: [ 20, 2 ] },
	torus: { make: () => new THREE.TorusGeometry( 50, 20, 200, 50 ), repeat: [ 4, 2 ] },
	distort: { make: distorted, repeat: [ 4, 4 ] },
	capsule: { make: () => new THREE.CapsuleGeometry( 25, 50, 16, 40 ), repeat: [ 2, 1 ] }
};

const mesh = new THREE.Mesh( new THREE.BufferGeometry(), material );
scene.add( mesh );

effect( function () {

	const model = models[ params.model() ];

	mesh.geometry.dispose();
	mesh.geometry = model.make();
	material.uniforms.repeat.value.fromArray( model.repeat );

} );

effect( function () {

	const u = material.uniforms;

	u.ambientWeight.value = params.ambient() / 100;
	u.diffuseWeight.value = params.diffuse() / 100;
	u.rimWeight.value = params.rim() / 100;
	u.specularWeight.value = params.specular() / 100;
	u.shininess.value = params.shininess();
	u.invertRim.value = params.invertRim() ? 1 : 0;
	u.solidRender.value = params.solid() ? 1 : 0;

	const ink = parseInt( params.ink().slice( 1 ), 16 );
	u.inkColor.value.set( ( ink >> 16 & 255 ) / 255, ( ink >> 8 & 255 ) / 255, ( ink & 255 ) / 255 );

} );

// ---- looking around: drag to turn, scroll or pinch to zoom

let lon = 0, lat = 15, nlon = 0, nlat = 0;
let fov = 120, nfov = 45;

const pointers = new Map();
let down = null;
let pinch = 0;

const canvas = renderer.domElement;

canvas.addEventListener( 'pointerdown', function ( e ) {

	canvas.setPointerCapture( e.pointerId );
	pointers.set( e.pointerId, { x: e.clientX, y: e.clientY } );
	canvas.classList.add( 'dragging' );

	down = { x: e.clientX, y: e.clientY, lon: nlon, lat: nlat };
	pinch = 0;

} );

canvas.addEventListener( 'pointermove', function ( e ) {

	if ( ! pointers.has( e.pointerId ) ) return;

	pointers.set( e.pointerId, { x: e.clientX, y: e.clientY } );

	if ( pointers.size === 2 ) {

		const [ a, b ] = [ ...pointers.values() ];
		const distance = Math.hypot( a.x - b.x, a.y - b.y );
		if ( pinch > 0 ) nfov *= pinch / distance;
		pinch = distance;
		return;

	}

	if ( down === null ) return;

	nlon = ( e.clientX - down.x ) * .5 + down.lon;
	nlat = ( e.clientY - down.y ) * .5 + down.lat;

} );

function release( e ) {

	pointers.delete( e.pointerId );
	if ( pointers.size === 0 ) canvas.classList.remove( 'dragging' );

	// the finger that stays goes on turning from where it is
	const [ rest ] = pointers.values();
	down = rest ? { x: rest.x, y: rest.y, lon: nlon, lat: nlat } : null;
	pinch = 0;

}

canvas.addEventListener( 'pointerup', release );
canvas.addEventListener( 'pointercancel', release );

canvas.addEventListener( 'wheel', function ( e ) {

	e.preventDefault();
	nfov += e.deltaY * ( e.deltaMode === 1 ? 16 : 1 ) * .012;

}, { passive: false } );

window.addEventListener( 'resize', function () {

	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();

	renderer.setSize( window.innerWidth, window.innerHeight );
	material.uniforms.viewport.value.set( window.innerWidth, window.innerHeight );

} );

let last = performance.now();

function render() {

	requestAnimationFrame( render );

	const now = performance.now();
	const ease = 1 - Math.pow( .9, Math.min( .1, ( now - last ) / 1000 ) * 60 );
	last = now;

	nlat = Math.max( - 85, Math.min( 85, nlat ) );
	nfov = Math.max( 10, Math.min( 120, nfov ) );

	lat += ( nlat - lat ) * ease;
	lon += ( nlon - lon ) * ease;
	fov += ( nfov - fov ) * ease;

	const phi = ( 90 - lat ) * Math.PI / 180;
	const theta = lon * Math.PI / 180;
	const d = 300;

	camera.position.set( d * Math.sin( phi ) * Math.cos( theta ), d * Math.cos( phi ), d * Math.sin( phi ) * Math.sin( theta ) );
	camera.lookAt( scene.position );

	camera.fov = fov;
	camera.updateProjectionMatrix();

	material.uniforms.pixelRatio.value = renderer.getPixelRatio();

	renderer.clear();

	if ( params.outline() ) {

		material.depthWrite = false;
		material.uniforms.showOutline.value = 1;
		renderer.render( scene, camera );

	}

	material.depthWrite = true;
	material.uniforms.showOutline.value = 0;
	renderer.render( scene, camera );

}

render();
</script>

	</body>
</html>
